schema_version = 1

[ap]
ssid = "NetBridge-Lab"
channel = 6
# "auto" uses the device's configured Wi-Fi regulatory domain, or set a 2-letter ISO code (e.g. "US", "GB", "DE").
country = "auto"
client_isolation = true

[lan]
cidr = "192.168.50.1/24"
dhcp_start = "192.168.50.100"
dhcp_end = "192.168.50.199"
lease_seconds = 600

[network]
# Empty values are discovered at install time and saved in device state.
lan_interface = ""
wan_interface = ""
